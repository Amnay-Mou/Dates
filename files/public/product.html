<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filali Dates</title><link rel="icon" type="image/png" href="images/logo.png"><link rel="apple-touch-icon" href="images/logo.png"><link rel="stylesheet" href="style.css"><link rel="expect" href="#pready" blocking="render"></head><body><div id="header"></div><main><div class="panel detail"><div><img class="main-img" id="big" alt=""><div class="thumbs" id="th"></div></div>
<div><h1 id="nm"></h1><p class="refline" id="rf"></p><p id="ds"></p><div class="pbox" id="pb"><div class="price"><span id="pr"></span><span id="pm"></span></div><p class="save" id="sv"></p><p class="save" id="cd"></p><p class="lq" id="lq"></p><p class="lq" id="bx"></p></div>
<p data-i="qty" style="margin-bottom:0;font-size:1.15rem"></p><div class="qty"><button id="mn">−</button><span id="q">1</span><button id="pl">+</button></div>
<div class="trust" id="tr"></div><button class="cta" id="add"></button><a class="wa-btn" id="wb" target="_blank" rel="noopener" data-i="wa"></a><button class="shr-btn" id="shb" type="button"></button><p class="info" id="pi"></p></div></div>
<section class="panel reviews"><h2><span data-i="comments"></span><span class="rv-count" id="cc"></span></h2>
<div class="rv-form"><div class="rv-user"><span class="av" id="fav">?</span><input id="au" data-ph="yourName" maxlength="50" autocomplete="name"></div>
<textarea id="tx" data-ph="yourComment" rows="3" maxlength="500"></textarea>
<input id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="rv-foot"><span class="rv-cnt" id="cnt">0/500</span><span class="rv-id" id="cu"></span><button class="cta rv-btn" id="snd" data-i="send"></button></div>
<p class="rv-msg" id="rvm"></p></div><div id="cl"></div></section></main><div id="footer"></div><script src="app.js"></script>
<script>
ready.then(()=>{
const p=PRODUCTS.find(x=>x.id===new URLSearchParams(location.search).get('id'))||PRODUCTS[0];if(!p){document.body.insertAdjacentHTML('beforeend','<i id="pready"></i>');return}let n=1;big.style.viewTransitionName='pimg-'+p.id;
const show=s=>{if(big.getAttribute('src')===s)return;if(big.getAttribute('src')){big.style.opacity=.2;big.onload=()=>big.style.opacity=1}big.src=s;document.querySelectorAll('#th img').forEach(i=>i.classList.toggle('on',i.dataset.s===s))};
th.innerHTML=p.imgs.map(s=>`<img src="${s}" data-s="${s}" alt="">`).join('');th.onclick=e=>e.target.dataset.s&&show(e.target.dataset.s);show(p.imgs[0]);
const upd=()=>{q.textContent=n;q.classList.remove('pop');void q.offsetWidth;q.classList.add('pop');
sv.textContent=isPromo(p)?`${t('save')} ${dh((p.old-p.price)*n)}`:'';
if(isPromo(p)){const ms=new Date(p.until+'T23:59:59')-new Date(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);cd.textContent=`⏳ ${t('endsIn')} ${d}${lang==='ar'?' يوم':lang==='fr'?'j':'d'} ${h}${lang==='ar'?' ساعة':'h'}`}else cd.textContent='';
wb.href=`https://wa.me/${COMPANY.wa}?text=${encodeURIComponent(p.name[lang]+' x'+n+' = '+dh(unit(p)*n))}`;
tr.innerHTML=`<span>${t('b1')}</span><span>${t('b2')}</span><span>${t('b3')}</span>`;
add.textContent=`${t('add')} — \u2068${dh(unit(p)*n)}\u2069`};
mn.onclick=()=>{n=Math.max(1,n-1);upd()};pl.onclick=()=>{n=Math.min(5,n+1);upd()};
add.onclick=()=>{sessionStorage.setItem('order',JSON.stringify({id:p.id,product:p.name[lang],qty:n,total:unit(p)*n}));location.href='checkout.html'};
shb.onclick=()=>shareProduct(p);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const tg=e.target.tagName;if(e.target.id==='au'){e.preventDefault();tx.focus();return}if(['INPUT','TEXTAREA','BUTTON','A'].includes(tg))return;e.preventDefault();add.click()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const ini=s=>[...s.trim()][0]||'?';
const ago=iso=>{const s=(new Date(iso)-Date.now())/1000,f=new Intl.RelativeTimeFormat(lang,{numeric:'auto'});for(const[u,n]of[['year',31536e3],['month',2592e3],['day',864e2],['hour',3600],['minute',60]])if(Math.abs(s)>=n)return f.format(Math.round(s/n),u);return f.format(0,'second')};
async function load(){
const r=await(await fetch('/api/comments/'+p.id)).json();cc.textContent=r.length||'';
cl.innerHTML=r.length?r.map(c=>`<article class="rv-item"><span class="av" style="background:hsl(${hue(c.author)} 42% 40%)">${esc(ini(c.author))}</span><div><div class="rv-top"><b>${esc(c.author)}</b><time title="${esc(new Date(c.created_at).toLocaleString())}">${esc(ago(c.created_at))}</time></div><p class="rv-text">${esc(c.text)}</p></div></article>`).join(''):`<div class="rv-empty">💬<br>${t('empty')}</div>`}
const setMsg=(m,bad)=>{rvm.textContent=m;rvm.className='rv-msg'+(bad?' err':'')};
au.value=localStorage.getItem('cname')||'';fav.textContent=ini(au.value);
au.oninput=()=>{fav.textContent=ini(au.value)};
tx.oninput=()=>{cnt.textContent=tx.value.length+'/500'};
tx.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))snd.click()};
snd.onclick=async()=>{
if(!au.value.trim()||!tx.value.trim()){setMsg(t('cmNeed'),1);return}
snd.disabled=true;setMsg('');
try{const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:p.id,author:au.value,text:tx.value,customer_id:cid(),website:hp.value})});
if(!r.ok)throw 0;localStorage.setItem('cname',au.value.trim());tx.value='';cnt.textContent='0/500';setMsg(t('cmThanks'));await load()}
catch{setMsg(t('fail'),1)}
snd.disabled=false};
window.onLang=()=>{shb.innerHTML=SHARE_SVG+' '+escH(t('shareLbl'));rf.textContent=t('ref')+': '+p.id.toUpperCase();cu.textContent=t('custNo')+' '+cid();nm.textContent=p.name[lang];ds.textContent=p.desc[lang];pr.textContent=dh(unit(p));pm.innerHTML=isPromo(p)?promoText(p):'';pb.classList.toggle('hot',isPromo(p));lq.textContent=t('limited');bx.textContent='📦 '+t('boxNote');pi.textContent='🕒 '+t('prepInfo');upd();load()}
document.body.insertAdjacentHTML('beforeend','<i id="pready"></i>');
});
</script></body></html>
