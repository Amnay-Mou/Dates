<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <main>

        <img class="wlogo" src="images/logo.png" alt="" onerror="this.style.display='none'" />
        <h1 data-i="wTitle"></h1>
        <p class="lead" data-i="wLead"></p>

        <div class="promises">
          <div>
            <span>🌱</span>
            <h3 data-i="w1t"></h3>
            <p data-i="w1"></p>
          </div>
          <div>
            <span>🤝</span>
            <h3 data-i="w2t"></h3>
            <p data-i="w2"></p>
          </div>
          <div>
            <span>✨</span>
            <h3 data-i="w3t"></h3>
            <p data-i="w3"></p>
          </div>
        </div>

        <a class="cta" href="index.html" data-i="shop" style="display:inline-block;width:auto;padding:16px 46px;text-decoration:none"></a>
      </section>
    </main>
    <div id="footer"></div>

    <script src="app.js"></script>

</html>
