<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filali Dates</title><link rel="icon" type="image/png" href="images/logo.png"><link rel="apple-touch-icon" href="images/logo.png"><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><main>
<h2 class="sect" data-i="title" style="margin-top:0"></h2><div class="grid" id="grid"></div></main><div id="footer"></div><script src="app.js"></script>
<script>
window.onLang=()=>{grid.innerHTML=PRODUCTS.map((p,i)=>`<article class="card" style="--i:${i}">${pct(p)?`<span class="tag">-${pct(p)}%</span>`:''}<button class="shr" type="button" data-id="${escH(p.id)}" aria-label="${escH(t('shareLbl'))}">${SHARE_SVG}</button><img src="${escH(p.imgs[0])}" alt="${escH(p.name[lang])}" loading="lazy" style="view-transition-name:pimg-${escH(p.id)}"><h3><a class="card-link" href="product.html?id=${encodeURIComponent(p.id)}">${escH(p.name[lang])}</a></h3><div class="cp${isPromo(p)?' hot':''}">${dh(unit(p))}${isPromo(p)?`<span class="old">${dh(p.old)}</span>`:''}</div><span class="go">${t('buy')}</span></article>`).join('')};
grid.onclick=e=>{const b=e.target.closest('.shr');if(b){e.preventDefault();const p=PRODUCTS.find(x=>x.id===b.dataset.id);if(p)shareProduct(p)}};
</script></body></html>
